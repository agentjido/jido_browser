name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation: auto, prepare, or publish"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - prepare
          - publish
      tag_name:
        description: "Optional v-prefixed tag for publish simulation"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (no git push, no tag, no GitHub release, no Hex publish)"
        required: false
        type: boolean
        default: false
      hex_dry_run:
        description: "Hex dry run only (run all git/release steps, but skip actual Hex publish)"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip tests before release"
        required: false
        type: boolean
        default: false
      version_override:
        description: "Optional bare SemVer override (for example 1.2.3, not v1.2.3)"
        required: false
        type: string
        default: ""
      staged_prepare:
        description: "Validate the generated commit before protected-main promotion"
        required: false
        type: boolean
        default: true
      staging_branch_prefix:
        description: "Owned checked-release branch prefix"
        required: false
        type: string
        default: "release/gitops/"

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Release
    uses: agentjido/github-actions/.github/workflows/jido-release.yml@v5.2.3
    with:
      operation: ${{ inputs.operation || 'auto' }}
      tag_name: ${{ inputs.tag_name || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      hex_dry_run: ${{ inputs.hex_dry_run || false }}
      skip_tests: ${{ inputs.skip_tests || false }}
      version_override: ${{ inputs.version_override || '' }}
      release_command: mix jido_browser.release --yes
      staged_prepare: ${{ inputs.staged_prepare || false }}
      validation_workflow: ci.yml
      required_checks: '["AgentBrowser smoke","CI / Summary"]'
      release_changed_files: '["CHANGELOG.md","mix.exs"]'
      generated_release_command: .github/scripts/validate-generated-release.sh
      staging_branch_prefix: ${{ inputs.staging_branch_prefix || 'release/gitops/' }}
      validation_timeout_seconds: 2700
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
